# CodeRabbit configuration
# Docs: https://docs.coderabbit.ai/reference/configuration
# Validate on a PR with: @coderabbitai configuration

language: en-US

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: false

  # Include/exclude paths (prefix with ! to exclude)
  path_filters:
    - "**/*.js"
    - "**/*.json"
    - "**/*.md"
    - "**/*.html"
    - "**/*.yaml"
    - "**/*.yml"
    - "!node_modules/**"
    - "!.wwebjs_auth/**"
    - "!.wwebjs_cache/**"
    - "!dist/**"
    - "!coverage/**"
    - "!.git/**"

  auto_review:
    enabled: true
    drafts: false
    incremental_review: true

  tools:
    eslint:
      enabled: true

chat:
  auto_reply: true
