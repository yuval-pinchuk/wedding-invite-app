<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easyWed · בית</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('adminTheme') || 'dark';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @property --bg { syntax: '<color>'; inherits: true; initial-value: #2a2421; }
    @property --surface { syntax: '<color>'; inherits: true; initial-value: #3a322e; }
    @property --surface2 { syntax: '<color>'; inherits: true; initial-value: #6b5b54; }
    @property --text { syntax: '<color>'; inherits: true; initial-value: #f7f4f0; }
    @property --muted { syntax: '<color>'; inherits: true; initial-value: #c9b8af; }
    @property --accent { syntax: '<color>'; inherits: true; initial-value: #c4a99a; }
    @property --accent-dim { syntax: '<color>'; inherits: true; initial-value: #a89084; }
    @property --accent-contrast { syntax: '<color>'; inherits: true; initial-value: #2a2421; }
    :root {
      --bg: #2a2421;
      --surface: #3a322e;
      --surface2: #6b5b54;
      --text: #f7f4f0;
      --muted: #c9b8af;
      --input-bg: #231e1b;
      --accent: #c4a99a;
      --accent-dim: #a89084;
      --accent-contrast: #2a2421;
      --radius: 12px;
      --font: 'Heebo', 'DM Sans', system-ui, sans-serif;
      transition:
        --bg 0.4s ease,
        --surface 0.4s ease,
        --surface2 0.4s ease,
        --text 0.4s ease,
        --muted 0.4s ease,
        --input-bg 0.4s ease,
        --accent 0.4s ease,
        --accent-dim 0.4s ease,
        --accent-contrast 0.4s ease;
    }
    :root[data-theme="light"] {
      --bg: #f7f4f0;
      --surface: #fffcfa;
      --surface2: #c9b8af;
      --text: #4a3f3a;
      --muted: #8e7c76;
      --input-bg: #fffcfa;
      --accent: #8e7c76;
      --accent-dim: #6d5952;
      --accent-contrast: #fffcfa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .layout { max-width: 920px; margin: 0 auto; padding: 64px 20px 48px; }
    header { margin-bottom: 28px; }
    header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    header p { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }
    .welcome {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 10px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      border: 2px solid var(--surface2);
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .stat {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--surface2);
    }
    .stat .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .stat .value { font-size: 1.45rem; font-weight: 700; color: var(--accent); }
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .chart-panel {
      background: var(--bg);
      border: 1px solid var(--surface2);
      border-radius: 12px;
      padding: 16px 14px 10px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }
    .chart-panel h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: center;
    }
    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 220px;
    }
    .chart-empty {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      min-height: 220px;
    }
    .chart-panel.is-empty .chart-wrap { display: none; }
    .chart-panel.is-empty .chart-empty { display: flex; }
    @media (max-width: 700px) {
      .charts-grid { grid-template-columns: 1fr; }
    }
    .message {
      margin: 12px 0 0;
      padding: 12px 14px;
      border-radius: 8px;
      display: none;
      font-size: 0.9rem;
    }
    .message.show { display: block; }
    .message.err { background: rgba(196, 123, 115, 0.18); color: #e0b5b0; }

    .corner-logout,
    .corner-menu {
      position: fixed;
      top: 14px;
      z-index: 200;
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--surface2);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }
    .corner-logout { left: 14px; }
    .corner-menu { right: 14px; }
    .corner-logout:hover,
    .corner-menu:hover {
      color: var(--accent-contrast);
      background: var(--accent);
      border-color: var(--accent);
    }
    .corner-logout svg,
    .corner-menu svg { width: 20px; height: 20px; display: block; pointer-events: none; }

    .nav-backdrop {
      position: fixed;
      inset: 0;
      z-index: 290;
      background: rgba(42, 36, 33, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
    }
    .nav-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .nav-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 300;
      width: min(320px, 88vw);
      height: 100%;
      background: var(--surface);
      border-left: 2px solid var(--surface2);
      box-shadow: -12px 0 40px rgba(0,0,0,0.25);
      transform: translateX(105%);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 18px 28px;
    }
    .nav-drawer.is-open { transform: translateX(0); }
    .nav-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .nav-drawer-head strong {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.35rem;
    }
    .nav-close {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid var(--surface2);
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
    }
    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      padding: 14px 14px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: var(--bg);
      transition: border-color 0.2s, background-color 0.2s;
    }
    .nav-links a:hover { border-color: var(--accent); }
    .nav-links a.is-active {
      background: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
    }
    .nav-theme {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--surface2);
    }
    .nav-theme p {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .theme-switch {
      display: flex;
      gap: 2px;
      padding: 4px;
      border-radius: 12px;
      background: var(--bg);
      border: 2px solid var(--surface2);
      width: fit-content;
    }
    .theme-opt {
      width: 40px;
      height: 40px;
      padding: 0;
      margin: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .theme-opt svg { width: 18px; height: 18px; display: block; }
    .theme-opt[aria-checked="true"] {
      background: var(--accent);
      color: var(--accent-contrast);
    }
    body.nav-open { overflow: hidden; }
  </style>
</head>
<body>
  <button type="button" id="logoutBtn" class="corner-logout" title="יציאה" aria-label="יציאה למסך התחברות" onclick="void logoutToLogin()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  </button>
  <button type="button" id="navMenuBtn" class="corner-menu" aria-label="תפריט" aria-expanded="false" aria-controls="navDrawer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
  <div id="navBackdrop" class="nav-backdrop" hidden></div>
  <aside id="navDrawer" class="nav-drawer" aria-hidden="true">
    <div class="nav-drawer-head">
      <strong>easyWed</strong>
      <button type="button" class="nav-close" id="navCloseBtn" aria-label="סגירת תפריט">×</button>
    </div>
    <nav class="nav-links">
      <a href="/manage" data-nav="home" class="is-active">בית</a>
      <a href="/manage/invites" data-nav="invites"< שליחת הזמנות</a>
      <a href="/manage/pay" data-nav="pay">מתנות</a>
    </nav>
    <div class="nav-theme">
      <p>מצב תצוגה</p>
      <div class="theme-switch" role="radiogroup" aria-label="מצב תצוגה">
        <button type="button" class="theme-opt" role="radio" data-theme-value="light" aria-checked="false" title="מצב בהיר" aria-label="מצב בהיר">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
        <button type="button" class="theme-opt" role="radio" data-theme-value="dark" aria-checked="false" title="מצב כהה" aria-label="מצב כהה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="layout">
    <header>
      <h1>easyWed</h1>
      <p class="welcome" id="welcomeLine">טוען…</p>
      <p id="welcomeDate"></p>
    </header>

    <div class="card">
      <h2>אורחים ואישורים</h2>
      <div class="stats" id="guestStats"></div>
      <div class="charts-grid">
        <div class="chart-panel" id="rsvpChartPanel">
          <h3>סטטוס RSVP</h3>
          <div class="chart-wrap"><canvas id="rsvpChart"></canvas></div>
          <div class="chart-empty">אין עדיין נתוני RSVP</div>
        </div>
        <div class="chart-panel" id="waChartPanel">
          <h3>שליחות וואטסאפ</h3>
          <div class="chart-wrap"><canvas id="waChart"></canvas></div>
          <div class="chart-empty">אין אורחים עם טלפון</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>מתנות</h2>
      <div class="stats" id="payStats"></div>
      <div class="charts-grid" style="grid-template-columns: 1fr;">
        <div class="chart-panel" id="giftChartPanel">
          <h3>התקדמות מתנות מול קיבולת</h3>
          <div class="chart-wrap"><canvas id="giftChart"></canvas></div>
          <div class="chart-empty">אין נתוני מתנות</div>
        </div>
      </div>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    let rsvpChart;
    let waChart;
    let giftChart;
    let lastDashboardData = null;

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function chartPalette() {
      const accent = cssVar('--accent') || '#8e7c76';
      const muted = cssVar('--muted') || '#c9b8af';
      const text = cssVar('--text') || '#4a3f3a';
      const isDark = document.documentElement.dataset.theme === 'dark';
      return {
        accent,
        muted,
        text,
        soft: isDark ? '#6b5b54' : '#ebe4dc',
        warm: isDark ? '#a89084' : '#6d5952',
        rose: isDark ? '#c47b73' : '#b8897f',
        sage: isDark ? '#9aab8e' : '#8a9a7a',
        grid: isDark ? 'rgba(201, 184, 175, 0.18)' : 'rgba(142, 124, 118, 0.2)',
      };
    }

    function destroyChart(chart) {
      if (chart) chart.destroy();
      return null;
    }

    function setPanelEmpty(panelId, empty) {
      document.getElementById(panelId).classList.toggle('is-empty', empty);
    }

    function renderCharts(data) {
      if (typeof Chart === 'undefined') return;
      const g = data.guests || {};
      const p = data.payment || {};
      const colors = chartPalette();

      const rsvpValues = [g.attending || 0, g.notAttending || 0, g.pendingRsvp || 0];
      const rsvpTotal = rsvpValues.reduce((a, b) => a + b, 0);
      setPanelEmpty('rsvpChartPanel', rsvpTotal === 0);
      rsvpChart = destroyChart(rsvpChart);
      if (rsvpTotal > 0) {
        rsvpChart = new Chart(document.getElementById('rsvpChart'), {
          type: 'doughnut',
          data: {
            labels: ['מגיעים', 'לא מגיעים', 'טרם ענו'],
            datasets: [{
              data: rsvpValues,
              backgroundColor: [colors.sage, colors.rose, colors.soft],
              borderColor: cssVar('--surface'),
              borderWidth: 3,
              hoverOffset: 6,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '62%',
            plugins: {
              legend: {
                position: 'bottom',
                rtl: true,
                labels: {
                  color: colors.text,
                  font: { family: 'Heebo', size: 12 },
                  padding: 14,
                  usePointStyle: true,
                  pointStyle: 'circle',
                },
              },
              tooltip: {
                rtl: true,
                titleFont: { family: 'Heebo' },
                bodyFont: { family: 'Heebo' },
              },
            },
            animation: { animateRotate: true, duration: 900 },
          },
        });
      }

      const waValues = [g.waSent || 0, g.waUnsent || 0];
      const waTotal = waValues.reduce((a, b) => a + b, 0);
      setPanelEmpty('waChartPanel', waTotal === 0);
      waChart = destroyChart(waChart);
      if (waTotal > 0) {
        waChart = new Chart(document.getElementById('waChart'), {
          type: 'pie',
          data: {
            labels: ['נשלח', 'לא נשלח'],
            datasets: [{
              data: waValues,
              backgroundColor: [colors.accent, colors.soft],
              borderColor: cssVar('--surface'),
              borderWidth: 3,
              hoverOffset: 6,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                rtl: true,
                labels: {
                  color: colors.text,
                  font: { family: 'Heebo', size: 12 },
                  padding: 14,
                  usePointStyle: true,
                  pointStyle: 'circle',
                },
              },
              tooltip: {
                rtl: true,
                titleFont: { family: 'Heebo' },
                bodyFont: { family: 'Heebo' },
              },
            },
            animation: { animateRotate: true, duration: 900 },
          },
        });
      }

      const received = Number(p.totalReceived || 0);
      const capacity = Number(p.totalCapacity || 0);
      const remaining = Math.max(0, capacity - received);
      setPanelEmpty('giftChartPanel', capacity <= 0 && received <= 0);
      giftChart = destroyChart(giftChart);
      if (capacity > 0 || received > 0) {
        giftChart = new Chart(document.getElementById('giftChart'), {
          type: 'bar',
          data: {
            labels: ['התקבל', 'נותר עד קיבולת'],
            datasets: [{
              data: [received, remaining],
              backgroundColor: [colors.warm, colors.soft],
              borderRadius: 10,
              borderSkipped: false,
              maxBarThickness: 56,
            }],
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                rtl: true,
                titleFont: { family: 'Heebo' },
                bodyFont: { family: 'Heebo' },
                callbacks: {
                  label: (ctx) => '₪' + Number(ctx.raw || 0).toLocaleString('he-IL'),
                },
              },
            },
            scales: {
              x: {
                beginAtZero: true,
                grid: { color: colors.grid },
                ticks: {
                  color: colors.muted,
                  font: { family: 'Heebo', size: 11 },
                  callback: (value) => '₪' + Number(value).toLocaleString('he-IL'),
                },
              },
              y: {
                grid: { display: false },
                ticks: {
                  color: colors.text,
                  font: { family: 'Heebo', size: 12 },
                },
              },
            },
            animation: { duration: 900 },
          },
        });
      }
    }

    function applyTheme(theme) {
      const next = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('adminTheme', next);
      document.querySelectorAll('.theme-opt').forEach((btn) => {
        btn.setAttribute('aria-checked', btn.dataset.themeValue === next ? 'true' : 'false');
      });
      if (lastDashboardData) {
        window.requestAnimationFrame(() => renderCharts(lastDashboardData));
      }
    }

    async function logoutToLogin() {
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
      } catch (_) { /* still leave */ }
      window.location.assign('/login');
    }

    applyTheme(localStorage.getItem('adminTheme') || 'dark');
    document.querySelectorAll('.theme-opt').forEach((btn) => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.themeValue));
    });
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      void logoutToLogin();
    });

    const navBtn = document.getElementById('navMenuBtn');
    const navDrawer = document.getElementById('navDrawer');
    const navBackdrop = document.getElementById('navBackdrop');
    const navCloseBtn = document.getElementById('navCloseBtn');

    function setNavOpen(open) {
      navDrawer.classList.toggle('is-open', open);
      navBackdrop.classList.toggle('is-open', open);
      navBackdrop.hidden = !open;
      navDrawer.setAttribute('aria-hidden', open ? 'false' : 'true');
      navBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      document.body.classList.toggle('nav-open', open);
    }
    navBtn.addEventListener('click', () => setNavOpen(true));
    navCloseBtn.addEventListener('click', () => setNavOpen(false));
    navBackdrop.addEventListener('click', () => setNavOpen(false));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setNavOpen(false);
    });

    function money(n) {
      return '₪' + Number(n || 0).toLocaleString('he-IL');
    }

    function formatWeddingDate(value) {
      if (!value) return '';
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return match ? `${match[3]}.${match[2]}.${match[1].slice(2)}` : value;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showMessage(text) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message show err';
    }

    async function load() {
      try {
        const res = await fetch('/api/admin/dashboard', { cache: 'no-store', credentials: 'same-origin' });
        if (res.status === 401) {
          location.href = '/login';
          return;
        }
        const data = await res.json();
        if (!res.ok || data.success === false) throw new Error(data.error || 'שגיאה בטעינה');

        const account = data.account || {};
        const bride = account.brideName || '';
        const groom = account.groomName || '';
        const names = [bride, groom].filter(Boolean).join(' ו');
        document.getElementById('welcomeLine').textContent = names
          ? `החתונה של ${names}`
          : 'לוח הבקרה שלכם';
        const dateText = formatWeddingDate(account.weddingDate);
        document.getElementById('welcomeDate').textContent = dateText ? `תאריך החתונה: ${dateText}` : '';

        const g = data.guests || {};
        document.getElementById('guestStats').innerHTML = `
          <div class="stat"><div class="label">סה״כ אורחים</div><div class="value">${g.total ?? 0}</div></div>
          <div class="stat"><div class="label">מגיעים</div><div class="value">${g.attending ?? 0}</div></div>
          <div class="stat"><div class="label">לא מגיעים</div><div class="value">${g.notAttending ?? 0}</div></div>
          <div class="stat"><div class="label">טרם ענו</div><div class="value">${g.pendingRsvp ?? 0}</div></div>
          <div class="stat"><div class="label">נשלח בוואטסאפ</div><div class="value">${g.waSent ?? 0}</div></div>
          <div class="stat"><div class="label">לא נשלח</div><div class="value">${g.waUnsent ?? 0}</div></div>
        `;

        const p = data.payment || {};
        document.getElementById('payStats').innerHTML = `
          <div class="stat"><div class="label">התקבל</div><div class="value">${money(p.totalReceived)}</div></div>
          <div class="stat"><div class="label">קיבולת</div><div class="value">${money(p.totalCapacity)}</div></div>
          <div class="stat"><div class="label">קישור פעיל</div><div class="value" style="font-size:1rem">${escapeHtml(p.activeLinkLabel || '—')}</div></div>
          <div class="stat"><div class="label">מצב ניתוב</div><div class="value" style="font-size:1rem">${p.mode === 'manual' ? 'ידני' : 'אוטומטי'}</div></div>
        `;

        lastDashboardData = data;
        renderCharts(data);
      } catch (error) {
        showMessage(error.message || 'טעינת לוח הבקרה נכשלה');
      }
    }

    load();
  </script>
</body>
</html>
