services:
  - type: web
    name: wedding-invite-app
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: wedding-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GOOGLE_GUEST_SHEET_ID
        sync: false
      - key: GOOGLE_RESPONSE_SHEET_ID
        sync: false
      - key: RSVP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
  - type: cron
    name: wedding-invite-keepalive
    env: node
    schedule: "*/15 * * * *"
    buildCommand: node -e "process.exit(0)"
    startCommand: node scripts/pingHealth.js
    envVars:
      - key: KEEPALIVE_URL
        fromService:
          name: wedding-invite-app
          type: web
          envVarKey: RENDER_EXTERNAL_URL
